<h1>台電時間電價日曆資料</h1>
<p>依年度提供時間電價日別 JSON。資料整理自第三方 CSV，尚未逐日與台電官方日曆核對，使用前請自行確認。</p>
<p>年度資料：<a href="data/2026.json">2026</a>、<a href="data/2027.json">2027</a>；<a href="data/years.json">可用年份</a>。</p>
<p>網址格式：<code>data/{year}.json</code>，將年份代入即可取得對應檔案。</p>
<p>資料來源、日別定義與使用方法請見 <a href="https://github.com/TomorinCopilot/TaiPowerCalendar">GitHub 專案</a>。</p>
